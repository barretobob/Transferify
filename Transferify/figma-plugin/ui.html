<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#232323;color:#ccc;font:11px Arial,sans-serif}body{padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}.logo{width:154px;height:18px;flex-shrink:0;margin-bottom:5px}.label{color:#888;font-size:12px;margin-top:3px}.modes{display:flex;gap:4px}button{height:29px;background:#2d2d2d;border:0;border-radius:3px;color:white;font:700 10px Arial,sans-serif;cursor:pointer}.modes button{flex:1;opacity:.75;border:1pt solid transparent;background:#29abe2}.modes #modeCurrent{background:#f7931e}.modes button.active{opacity:1;border-color:white}.symbol{font-weight:900;font-size:15px;margin-right:4px}#send{background:#f7931e;font-weight:400;display:flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0}#send svg{width:17px;height:17px}.option{display:flex;align-items:center;gap:6px;min-height:29px;background:#606060;border-radius:3px;padding:6px 7px;font-size:10px;flex-shrink:0}.option input{margin:0;width:12px;height:12px;accent-color:#29abe2}.result-box{flex:1;min-height:92px;display:flex;flex-direction:column;margin-top:3px}.result-label{font-size:10px;color:#888;margin-bottom:5px}#status{flex:1;min-height:0;padding:8px;border:1px solid #3c3c3c;border-radius:3px;background:#191919;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.45;color:#b8b8b8}.version{font-size:9px;color:#777;flex-shrink:0}button:disabled{opacity:.45;cursor:default}::-webkit-scrollbar{width:10px;height:10px;background:#191919}::-webkit-scrollbar-track{background:#191919}::-webkit-scrollbar-thumb{background:#f7931e;border:2px solid #191919;border-radius:6px;min-height:24px}::-webkit-scrollbar-corner{background:#191919}
/* Match the After panel's compact import checkboxes. */
.option{background:transparent;border-radius:0;padding:0;min-height:18px;gap:5px;font-size:11px;line-height:1.35;color:#b8b8b8;cursor:pointer}
.option input{appearance:none;-webkit-appearance:none;position:relative;display:inline-block;flex:0 0 12px;width:12px;height:12px;margin:0;border:1px solid #666;border-radius:2px;background:#232323;cursor:pointer}
.option input:checked:after{content:"";position:absolute;left:3px;top:0;width:3px;height:6px;border:solid #f7931e;border-width:0 2px 2px 0;transform:rotate(45deg)}
.option input:focus-visible{outline:1px solid #999;outline-offset:2px}

.destination-row{display:flex;align-items:center;gap:8px;color:#b8b8b8}.destination-row select{flex:1;min-width:0;height:26px;background:#292929;color:#ccc;border:1px solid #555}.option.disabled{opacity:.45}#pullAI{flex-shrink:0;color:#29abe2}
