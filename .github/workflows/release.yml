name: Test and publish version
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transferify-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test updater and gradient copy
        run: |
          node tests/test-gradient-copy.cjs
          node tests/test-updater.cjs
      - name: Build release assets
        run: python3 scripts/build_release.py
      - name: Publish new version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("Transferify/CSXS/manifest.xml").getroot().attrib["ExtensionBundleVersion"])')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no files overwritten."
            exit 0
          fi
          gh release create "$TAG" "dist/Transferify_${VERSION}.zip" dist/transferify-update.json dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Transferify ${VERSION}" --notes-file RELEASE_NOTES.md --latest
